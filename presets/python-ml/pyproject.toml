[project]
name = "app"
version = "0.1.0"
description = "Решение хакатона (пресет python-ml)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
markers = ["e2e: сквозной сценарий демо (make e2e)"]

[tool.ruff]
line-length = 100
target-version = "py312"
